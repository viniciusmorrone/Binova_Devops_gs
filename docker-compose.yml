name: binova

services:
  db:
    image: postgres:16-alpine
    container_name: binova-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - binova_pg_data:/var/lib/postgresql/data
    networks:
      - binova_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: binova-api:1.0
    container_name: binova-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_H2_CONSOLE_ENABLED: "false"
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64}
      BINOVA_DEMO: "true"
      APP_DEMO_ADMIN_PASSWORD: ${APP_DEMO_ADMIN_PASSWORD}
      APP_DEMO_CIDADAO_PASSWORD: ${APP_DEMO_CIDADAO_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - binova_net

volumes:
  binova_pg_data:
    name: binova_pg_data

networks:
  binova_net:
    name: binova_net
    driver: bridge
